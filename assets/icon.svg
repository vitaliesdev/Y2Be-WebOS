<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed, and the edges are exactly "iconColor" from appinfo.json, so the
       icon blends into the launcher tile that webOS paints in that color. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d3d"/>
      <stop offset="1" stop-color="#ff0000"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <text x="256" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="190" letter-spacing="-6" fill="#ffffff">Y2B</text>
  <rect x="148" y="360" width="216" height="18" rx="9" fill="#ffffff" opacity="0.85"/>
</svg>
